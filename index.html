<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird — White Edition</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --muted: #777;
      --line: #e7e7e7;
      --green: #58c943;
      --green-dark: #278d2c;
      --yellow: #ffd83d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .app { width: min(100%, 760px); }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.25rem); letter-spacing: -1.2px; }
    .scores { display: flex; gap: 18px; text-align: right; }
    .score-label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; }
    .score-value { font-size: 1.25rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    .game-shell { position: relative; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 12px 35px #00000008; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; touch-action: manipulation; cursor: pointer; }
    .overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      padding: 24px; background: #ffffffd9;
    }
    .overlay.hidden { display: none; }
    .bird-icon { font-size: 3rem; margin-bottom: 8px; }
    .overlay h2 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0 0 8px; letter-spacing: -.7px; }
    .overlay p { color: #555; margin: 0 0 18px; line-height: 1.5; }
    button {
      border: 0; border-radius: 999px; padding: 12px 22px; background: #171717;
      color: white; font: inherit; font-weight: 700; cursor: pointer;
      transition: transform .12s ease, background .12s ease;
    }
    button:hover { background: #333; }
    button:active { transform: scale(.97); }
    .hint { text-align: center; color: var(--muted); font-size: .9rem; margin: 14px 0 0; }
    .hint strong { color: #444; }
    @media (max-width: 480px) {
      body { padding: 12px; align-items: flex-start; }
      header { align-items: flex-start; }
      .scores { gap: 10px; }
      .score-value { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Flappy Bird</h1>
      <div class="scores" aria-live="polite">
        <div><div class="score-label">Score</div><div class="score-value" id="score">0</div></div>
        <div><div class="score-label">Best</div><div class="score-value" id="best">0</div></div>
      </div>
    </header>
    <section class="game-shell" aria-label="Flappy Bird game">
      <canvas id="game" width="480" height="640" aria-label="Tap, click, or press Space to flap"></canvas>
      <div class="overlay" id="overlay">
        <div class="bird-icon" aria-hidden="true">🐤</div>
        <h2 id="overlay-title">Ready to fly?</h2>
        <p id="overlay-text">Tap or press Space to flap.<br>Pass through the pipes and beat your best score.</p>
        <button id="start-button">Start game</button>
      </div>
    </section>
    <p class="hint">Controls: <strong>Space</strong> / <strong>↑</strong> / tap to flap · <strong>R</strong> to restart</p>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlay = document.getElementById('overlay');
      const titleEl = document.getElementById('overlay-title');
      const textEl = document.getElementById('overlay-text');
      const startButton = document.getElementById('start-button');

      const W = canvas.width, H = canvas.height;
      const groundH = 64;
      const pipeW = 66;
      const gapH = 168;
      let bird, pipes, score, best, state, frame, lastTime, animationId;

      try { best = Number(localStorage.getItem('flappy-white-best')) || 0; }
      catch (_) { best = 0; }
      bestEl.textContent = best;

      function reset() {
        bird = { x: 118, y: H * 0.44, r: 14, vy: 0, rotation: 0 };
        pipes = [];
        score = 0;
        frame = 0;
        state = 'ready';
        scoreEl.textContent = '0';
        addPipe(W + 30);
        addPipe(W + 290);
        draw();
      }

      function addPipe(x) {
        const margin = 72;
        const gapY = margin + Math.random() * (H - groundH - margin * 2 - gapH);
        pipes.push({ x, gapY, passed: false });
      }

      function flap() {
        if (state === 'over') return;
        if (state === 'ready') {
          state = 'playing';
          overlay.classList.add('hidden');
        }
        bird.vy = -390;
      }

      function endGame() {
        if (state === 'over') return;
        state = 'over';
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          try { localStorage.setItem('flappy-white-best', String(best)); } catch (_) {}
        }
        titleEl.textContent = 'Game over';
        textEl.innerHTML = `You scored <strong>${score}</strong>. ${score > 0 ? 'Nice flying!' : 'Give it another try!'}<br>Can you beat your best?`;
        startButton.textContent = 'Play again';
        overlay.classList.remove('hidden');
      }

      function drawBird() {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.rotation);
        // Original simple cartoon bird drawn with canvas shapes.
        ctx.fillStyle = '#171717';
        ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd83d';
        ctx.beginPath(); ctx.ellipse(-1, -1, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f4bd25';
        ctx.beginPath(); ctx.ellipse(-5, 5, 7, 4, -.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(7, -6, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#171717';
        ctx.beginPath(); ctx.arc(9, -6, 2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f26b3a';
        ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(24, 3); ctx.lineTo(12, 7); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#171717'; ctx.lineWidth = 1.8; ctx.stroke();
        ctx.restore();
      }

      function drawPipe(pipe) {
        const topH = pipe.gapY;
        const bottomY = pipe.gapY + gapH;
        const bottomH = H - groundH - bottomY;
        const gradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeW, 0);
        gradient.addColorStop(0, '#36ad35');
        gradient.addColorStop(.25, '#72dc4b');
        gradient.addColorStop(.72, '#4dc23b');
        gradient.addColorStop(1, '#278d2c');
        ctx.fillStyle = gradient;
        ctx.strokeStyle = '#171717';
        ctx.lineWidth = 3;
        // Top pipe body and lower-facing lip
        ctx.fillRect(pipe.x + 5, 0, pipeW - 10, topH - 22);
        ctx.strokeRect(pipe.x + 5, -2, pipeW - 10, topH - 20);
        ctx.fillRect(pipe.x, topH - 24, pipeW, 24);
        ctx.strokeRect(pipe.x, topH - 24, pipeW, 24);
        // Bottom pipe body and upper-facing lip
        ctx.fillRect(pipe.x + 5, bottomY + 22, pipeW - 10, bottomH);
        ctx.strokeRect(pipe.x + 5, bottomY + 22, pipeW - 10, bottomH);
        ctx.fillRect(pipe.x, bottomY, pipeW, 24);
        ctx.strokeRect(pipe.x, bottomY, pipeW, 24);
        // Highlight stripe
        ctx.fillStyle = '#b4f48a';
        ctx.fillRect(pipe.x + 13, 4, 5, Math.max(0, topH - 31));
        ctx.fillRect(pipe.x + 13, bottomY + 28, 5, Math.max(0, bottomH - 8));
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, W, H);
        // Faint decorative clouds
        ctx.fillStyle = '#f7f7f7';
        for (const [x, y] of [[75, 115], [330, 175], [255, 300]]) {
          ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2);
          ctx.arc(x + 17, y - 5, 19, 0, Math.PI * 2);
          ctx.arc(x + 34, y, 13, 0, Math.PI * 2); ctx.fill();
        }
        pipes.forEach(drawPipe);
        // Ground
        ctx.fillStyle = '#fafafa'; ctx.fillRect(0, H - groundH, W, groundH);
        ctx.strokeStyle = '#dedede'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, H - groundH); ctx.lineTo(W, H - groundH); ctx.stroke();
        ctx.fillStyle = '#eee';
        for (let x = 0; x < W; x += 28) ctx.fillRect(x, H - 18, 14, 3);
        drawBird();
      }

      function update(dt) {
        if (state !== 'playing') {
          if (state === 'ready') bird.y = H * 0.44 + Math.sin(performance.now() / 240) * 7;
          return;
        }
        frame += dt;
        bird.vy += 1120 * dt;
        bird.y += bird.vy * dt;
        bird.rotation = Math.min(.9, Math.max(-.45, bird.vy / 520));
        const speed = 178;
        pipes.forEach(pipe => {
          pipe.x -= speed * dt;
          if (!pipe.passed && pipe.x + pipeW < bird.x) {
            pipe.passed = true;
            score++;
            scoreEl.textContent = score;
          }
        });
        while (pipes.length && pipes[0].x + pipeW < -5) pipes.shift();
        if (!pipes.length || pipes[pipes.length - 1].x < W - 260) addPipe(W + 20);

        const birdLeft = bird.x - 12, birdRight = bird.x + 14;
        const birdTop = bird.y - 10, birdBottom = bird.y + 10;
        if (birdBottom >= H - groundH || birdTop <= 0) { endGame(); return; }
        for (const pipe of pipes) {
          if (birdRight > pipe.x && birdLeft < pipe.x + pipeW) {
            if (birdTop < pipe.gapY || birdBottom > pipe.gapY + gapH) {
              endGame(); return;
            }
          }
        }
      }

      function loop(now) {
        const dt = Math.min((now - (lastTime || now)) / 1000, 0.032);
        lastTime = now;
        update(dt);
        draw();
        animationId = requestAnimationFrame(loop);
      }

      function startOrFlap() {
        if (state === 'over') return;
        flap();
      }
      startButton.addEventListener('click', () => {
        if (state === 'over') {
          titleEl.textContent = 'Ready to fly?';
          textEl.innerHTML = 'Tap or press Space to flap.<br>Pass through the pipes and beat your best score.';
          startButton.textContent = 'Start game';
          reset();
        }
        flap();
        overlay.classList.add('hidden');
      });
      canvas.addEventListener('pointerdown', event => {
        event.preventDefault();
        if (state === 'over') return;
        startOrFlap();
      });
      window.addEventListener('keydown', event => {
        if (['Space', 'ArrowUp'].includes(event.code)) {
          event.preventDefault();
          if (state === 'over') return;
          startOrFlap();
        } else if (event.code === 'KeyR') {
          titleEl.textContent = 'Ready to fly?';
          textEl.innerHTML = 'Tap or press Space to flap.<br>Pass through the pipes and beat your best score.';
          startButton.textContent = 'Start game';
          reset();
          overlay.classList.remove('hidden');
        }
      });

      reset();
      animationId = requestAnimationFrame(loop);
      window.addEventListener('pagehide', () => cancelAnimationFrame(animationId));
    })();
  </script>
</body>
</html>
